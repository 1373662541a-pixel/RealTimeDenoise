plugins {
    id 'com.android.application'
}

android {
    namespace 'com.realtimedenoise.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.realtimedenoise.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // no external dependencies: minimal
}
